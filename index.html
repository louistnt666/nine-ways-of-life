</style><main><header><span>人生九种 · Nine Ways of Life</span><span>ORIGINAL EDITION · 36</span></header><div id="app"></div><footer>原创生活态度趣味测试，仅供自我探索，不是经过验证的心理量表。结果描述本次选择，不定义你，也不推断你的成长经历。答题记录仅保存在本机浏览器。</footer></main><script>const types=[

function start(){pos=answers.length;if(pos===36)result();else render()}
function render(){busy=false;const q=questions[pos];app.innerHTML=`<progress max="36" value="${pos}"></progress><div class="meta">${String(pos+1).padStart(2,'0')} / 36 · ${Math.round(pos/36*100)}%</div><h2 tabindex="-1" id="question">${q.title}</h2><div class="options">${q.opts.map((o,j)=>`<button class="option ${answers[pos]===o.d?'selected':''}" onclick="pick(${o.d})"><span class="letter">${'ABCD'[j]}</span><span>${o.text}</span></button>`).join('')}</div><div class="nav"><button class="plain" onclick="back()" ${pos===0?'disabled':''}>← 上一题</button><button class="plain" onclick="home()">保存并返回首页</button></div><p class="small">选择后自动进入下一题 · 也可按键盘 1—4 选择</p>`;document.getElementById('question').focus();}
function pick(d){if(busy)return;busy=true;answers[pos]=d;save();pos++;if(pos===36)result();else render()}
function back(){if(pos>0){pos--;render()}}
function reset(){if(confirm('清空这次答题记录并重新开始？')){answers=[];save();pos=0;render()}}
function score(a){const scores=Array(9).fill(0);a.forEach(d=>scores[d]++);return scores}
function radar(scores){const point=(i,r)=>{const a=(i*40-90)*Math.PI/180;return [230+r*Math.cos(a),205+r*Math.sin(a)]};const polygon=r=>types.map((_,i)=>point(i,r).join(',')).join(' ');return `<svg viewBox="0 0 460 420" role="img" aria-label="九种倾向选择得分雷达图">${[35,70,105,140].map(r=>`<polygon points="${polygon(r)}" fill="none" stroke="#ded7c6"/>`).join('')}${types.map((t,i)=>{const p=point(i,140),l=point(i,177);return `<path d="M230 205 L${p}" stroke="#ded7c6"/><text x="${l[0]}" y="${l[1]}" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#817c70">${t[0]}</text>`}).join('')}<polygon points="${scores.map((s,i)=>point(i,s/16*140).join(',')).join(' ')}" fill="#397e6b33" stroke="#397e6b" stroke-width="2"/></svg>`}
function result(){busy=false;const scores=score(answers),order=types.map((t,i)=>i).sort((a,b)=>scores[b]-scores[a]),top=order[0],ties=order.filter(i=>scores[i]===scores[top]),t=types[top];app.innerHTML=`<section class="hero"><div class="meta">你的本次选择画像</div><h1>${ties.length>1?'多重倾向并列':t[0]}</h1><p class="green">${ties.length>1?ties.map(i=>types[i][0]).join(' · '):t[1]}</p><p>「 ${ties.length>1?'你的答案暂时没有指向唯一主色':t[2]} 」</p></section><h3>01 · 九种倾向</h3>${radar(scores)}${order.map(i=>`<div class="row"><span>${types[i][0]}</span><div class="track"><div class="fill" style="width:${scores[i]/16*100}%"></div></div><span>${scores[i]}/16</span></div>`).join('')}<p class="small">每种倾向在 16 道题中出现，每次选中计 1 分，共 36 次选择。分数表示本题库中的选择次数，不是人格百分比或心理测量准确率；同分不强行区分先后。</p><h3>02 · 你的主要倾向</h3>${order.filter((i,k)=>k<3||scores[i]===scores[order[2]]).map(i=>`<article class="card"><div class="meta">${scores[i]} 次选择 · ${types[i][1]}</div><h2 class="green">${types[i][0]}</h2><p>${types[i][3]}</p><h3>值得留意</h3><p>${types[i][4]}</p><h3>可以试试</h3><p>${types[i][5]}</p></article>`).join('')}<h3>03 · 留给自己的三个问题</h3><p>哪一个选择最像最近的你？<br>哪一项是你想选、但现实中很少做到的？<br>如果生活条件改变，你的答案会如何变化？</p><div class="nav"><button class="primary" onclick="window.print()">打印 / 保存为 PDF</button><button class="plain" onclick="download()">下载结果文本</button></div><div class="nav"><button class="plain" onclick="pos=35;render()">← 返回修改答案</button><button class="plain" onclick="reset()">重新测试</button></div>`;window.scrollTo(0,0)}
function download(){const scores=score(answers);const text='生活的九种答案 · 本次结果\n\n'+types.map((t,i)=>`${t[0]}：${scores[i]}/16\n${t[3]}\n可以试试：${t[5]}\n`).join('\n')+'\n仅供自我探索，不是心理诊断。';const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='生活的九种答案-结果.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('keydown',e=>{if(document.getElementById('question')&&/^[1-4]$/.test(e.key)&&!e.repeat)pick(questions[pos].opts[Number(e.key)-1].d)});home();
</script><script>const profiles=[
{tags:['会享受','懂调节','重体验'],belief:['快乐不必等到所有任务结束','身体的感受也值得被听见','普通的一天也可以过得很好'],daily:['会主动寻找舒服的环境','愿意为喜欢的食物或体验留时间','气氛紧张时，常想先让大家放松'],relation:'你可能擅长把陪伴变成具体的快乐：一起吃饭、散步，或者什么都不做。遇到沉重的话题时，试着先问对方需要倾听还是调节气氛，不必急着让难过消失。',mis:[['只顾眼前','你在提醒自己，生活不能永远延期。'],['不够上进','你可能只是没有把忙碌当作唯一的价值。']],energy:['不被打断的休息','轻松自在的陪伴','身体舒适的环境'],drain:['持续紧绷的节奏','把休息当成懒惰','快乐被不断推迟'],ask:'你正在选择真正的休息，还是暂时躲开一件需要处理的事？',actions:['安排一段不需要完成目标的休息','为一个重要但不愉快的任务保留十分钟'],quote:'我愿意认真生活，也愿意让认真里有快乐。'},
{tags:['有边界','敢表达','重自主'],belief:['自己的需要不必总排最后','清楚的约定比猜测更可靠','合作可以从坦诚谈条件开始'],daily:['答应事情前先估算付出','会留意责任与回报是否对等','不愿靠委屈自己维持表面的和气'],relation:'你可能更信任明确的表达，而非含糊的牺牲。对方未说出口的需求不一定是试探；在守住边界的同时，多问一句，也能避免把亲近变成谈判。',mis:[['太计较','你想让付出成为选择，而不是义务。'],['不好接近','你需要确定关系里可以安心说不。']],energy:['边界被尊重','公平清晰的分工','可以自己决定的时间'],drain:['默认你必须付出','用感情施加压力','责任无限增加'],ask:'这次拒绝是在保护重要的边界，还是因为担心任何付出都会吃亏？',actions:['把一条重要边界用温和而明确的话说出来','尝试一次自己愿意承担的小额善意'],quote:'我照顾自己的位置，也为自愿的靠近留一扇门。'},
{tags:['清醒','会追问','不盲从'],belief:['承诺需要行动来证明','质疑可以帮助事情变得真实','多数人的热情不等于证据'],daily:['会查宣传之外的信息','容易发现说法中的矛盾','对过分完美的故事保持距离'],relation:'你可能会通过提醒风险来表达关心。但当对方正在分享期待时，先听见他的兴奋，再指出具体问题，通常比直接否定更容易让提醒被接住。',mis:[['太扫兴','你担心大家为未经核实的承诺付出代价。'],['什么都不信','你更愿意相信可反复验证的行动。']],energy:['坦诚说明局限的人','经得起追问的证据','允许不同意见的环境'],drain:['强迫认同的口号','承诺与行动不符','把质疑当成敌意'],ask:'你的怀疑还在帮助你寻找事实，还是已经替事实提前下了结论？',actions:['为一件看好的事情也列出支持证据','提出一个可回答的问题，替代一次笼统否定'],quote:'我保留怀疑，也保留被事实说服的能力。'},
{tags:['能落地','会规划','很稳妥'],belief:['先找到眼下能做的一步','承认限制才有调整的空间','可靠来自持续兑现的小事'],daily:['做决定前会核对成本和时间','常把复杂问题拆成可执行步骤','比起口头保证，更看重实际进展'],relation:'你可能习惯用安排和解决问题表达在乎。对方有时需要的却是被理解，而非一份方案。先说一句“这件事确实让你难受”，不会削弱你的解决能力。',mis:[['没有情趣','你常把在意藏在提前安排好的细节里。'],['想得太多','你希望选择之后仍有承担后果的余地。']],energy:['明确的下一步','承诺被按时兑现','混乱逐渐有序'],drain:['反复变化却不解释的安排','只有愿景没有资源','临时把责任推给你'],ask:'你是在评估真实的风险，还是因为无法完全确定，就不允许自己开始？',actions:['为一件心动的事设一个可承受的试错预算','表达一次感受，暂时不急着提供解决方案'],quote:'我把生活一寸寸搭好，也给未知留一点位置。'},
{tags:['有温度','会照看','重连接'],belief:['具体的人比抽象的评价重要','帮助应该回应真实的需要','彼此支持不等于单向消耗'],daily:['容易察觉别人状态的变化','会主动补上被忽略的小事','决定前会想到谁可能受到影响'],relation:'你可能很擅长照顾，却不太习惯提出自己的需求。关系中的可靠不必由你一人维持。让别人有机会帮助你，也是在邀请对方参与这段关系。',mis:[['没有主见','你会把他人的处境纳入判断。'],['太好说话','你重视连接，但仍然可以设定限度。']],energy:['帮助确实产生作用','真诚的回应','可以互相依靠'],drain:['付出被视为理所当然','长期只有你在照顾','拒绝后被指责'],ask:'如果没有人失望，你现在最想为自己做什么？',actions:['把一项需求直接告诉值得信任的人','帮忙前先问清对方真正需要什么'],quote:'我愿意照亮别人，也不让自己的灯一直透支。'},
{tags:['有信念','重原则','看长远'],belief:['值得的事不能只看眼前收益','方法也应符合想抵达的目标','坚持可以与调整同时发生'],daily:['会追问一件事是否真正值得','不容易用短期好处交换核心原则','愿意为长期改进投入精力'],relation:'你可能希望关系拥有共同的价值方向。不过，节奏不同未必代表立场相反。把对人的期待转化为具体协商，会比要求对方天然理解你的原则更有效。',mis:[['不切实际','你在替尚未实现的可能性保留空间。'],['太固执','你不愿轻易放弃自己认真认可的东西。']],energy:['价值一致的合作','看得见的长期进步','有人认真回应你的愿景'],drain:['被要求违背原则','只看短期收益','努力被轻率嘲讽'],ask:'你必须坚持的是目标本身，还是已经习惯的那一种做法？',actions:['把一个大愿景缩小成本周可完成的动作','给自己设一个复盘节点，而非无限坚持'],quote:'我想去的地方很远，但今天的一小步也算数。'},
{tags:['能抽离','不执著','留空白'],belief:['不是所有经历都需要结论','标签不能概括一个人的生活','放下评价后仍然可以行动'],daily:['对输赢和排名保持距离','不愿被宏大意义强行说服','有时宁愿让问题暂时没有答案'],relation:'你可能能帮助别人放下过重的评价。但“没什么大不了”未必能安慰正在难过的人。承认对方此刻很在意，并不要求你也相信那件事具有永恒意义。',mis:[['什么都不在乎','你可能只是不愿把暂时的评价当成终局。'],['没有方向','你不急着接受别人准备好的答案。']],energy:['不需要证明自己的空间','允许留白的交流','没有强制目标的时间'],drain:['凡事都要拔高意义','被要求持续表现热情','把成败等同于人的价值'],ask:'你放下的是别人的期待，还是连自己的真实喜欢也一起放下了？',actions:['做一件无需解释价值、但你愿意做的小事','告诉一个人你真实在意的具体细节'],quote:'即使没有终极答案，我仍可以认真度过今天。'},
{tags:['有主见','敢选择','愿承担'],belief:['建议可以听，选择仍需自己做','我可以修订对自己的理解','求助也可以是一种主动选择'],daily:['会区分自己的意愿与他人的期待','愿意为亲自做出的决定承担代价','不喜欢被固定标签替自己下结论'],relation:'你可能重视彼此独立，不愿用亲密替代个人决定。也要让对方知道：独立不等于不需要陪伴。说清哪些事情想自己决定、哪些希望一起商量，关系会更从容。',mis:[['太任性','你在确认生活是否经过自己的同意。'],['不需要别人','你想保留选择权，也可以渴望支持。']],energy:['有真实选择的空间','被尊重的不同意见','可以尝试新身份'],drain:['被强行定义','替你决定却要求感激','必须照着别人期待生活'],ask:'这个选择来自真正的喜欢，还是只是为了证明没有人能左右你？',actions:['写下一项选择以及你愿意承担的具体代价','主动邀请一个人参与你的决定过程'],quote:'我为选择署名，也允许下一页写出新的自己。'},
{tags:['感受细腻','有表达','珍惜瞬间'],belief:['不能量化的感受也有价值','日常值得被认真看见','表达可以让短暂的东西留下来'],daily:['容易记住光线、声音和氛围','喜欢给普通日子增加个人仪式','常被一个细节激发创作或行动'],relation:'你可能擅长创造被记住的时刻，也期待对方理解细微的暗示。但敏锐不是双方自动共享的能力；把期待说出来，常比等待对方猜中更能保护亲密。',mis:[['太敏感','你接收到的细节可能比说出来的更多。'],['只凭感觉','感受是你的重要信息来源，也可以与事实一起使用。']],energy:['被理解的表达','有美感的日常','真诚而细腻的回应'],drain:['感受被轻视','过度功利的比较','只能赶路、无法停留'],ask:'让你留恋的是此刻真实的人和事，还是想象中更美的版本？',actions:['把一个美好的想法落成可预约的具体安排','向重要的人明确说出一个小期待'],quote:'我愿意为心动停留，也愿意照料心动之后的日常。'}
];
function section(n,title,body){return `<section class="report-section"><h3><span class="meta">${String(n).padStart(2,'0')}</span> ${title}</h3>${body}</section>`}
function list(items){return '<ul class="report-list">'+items.map(x=>`<li>${x}</li>`).join('')+'</ul>'}
function detail(i){const p=profiles[i],t=types[i];return section('03','你的信条',list(p.belief))+section('04','详细解读',`<div class="report-quote"><p>${t[3]}</p><p>这些选择更像你当前常用的一套判断方式：${p.daily.join('；')}。它能在适合的情境中帮助你，却不必成为每一次决定的唯一依据。</p></div>`)+section('05','看见自己的判断方式',`<p>${p.ask}</p><p class="small">问卷无法判断这种倾向来自哪段经历。可以回想近期的一次决定，看看当时的资源、压力与关系如何影响了你。</p>`)+section('06','日常的样子',list(p.daily))+section('07','别人说 / 另一种理解',p.mis.map(m=>`<div class="report-pair"><span>「${m[0]}」</span><p>${m[1]}</p></div>`).join(''))+section('08','更深一层',`<div class="report-quote"><h4>可能的盲点</h4><p>${t[4]}</p><h4>你在关系里</h4><p>${p.relation}</p></div>`)+section('09','能量与消耗',`<div class="report-grid"><div><h4 class="green">＋ 让你充电</h4>${list(p.energy)}</div><div><h4>－ 让你消耗</h4>${list(p.drain)}</div></div>`)+section('10','相处时的提醒',`<div class="card"><p>遇到节奏相近的人，可以从「${p.energy[0]}」建立共同体验。</p><p>遇到让你感到「${p.drain[0]}」的情况，先描述具体行为和需求，不急着给对方贴类型标签。</p></div><p class="small">本测试不测量两个人的关系匹配度，不将某种类型判定为你的最佳或最差伴侣。</p>`)+section('11','可以试试',list([t[5],...p.actions]))+section('12','留给你的一句话',`<p class="closing">${p.quote}</p>`)}
function result(){busy=false;const scores=score(answers),order=types.map((_,i)=>i).sort((a,b)=>scores[b]-scores[a]),ties=order.filter(i=>scores[i]===scores[order[0]]),top=order[0];const groups=[...new Set(order.map(i=>scores[i]))].slice(0,3);app.innerHTML=`<section class="hero"><div class="meta">你的本次选择画像</div><h1>${ties.length>1?'多重倾向并列':types[top][0]}</h1><p class="green">${ties.map(i=>types[i][1]).join(' · ')}</p>${ties.length===1?profiles[top].tags.map(x=>`<span class="badge">${x}</span>`).join(''):''}<p>「${ties.length===1?types[top][2]:'你的答案没有指向唯一主色'}」</p><div class="score-ring"><strong>${scores[top]}</strong><span>/ 16</span></div><p class="small">最高倾向被选次数 · 不是准确率</p></section>`+section(1,'风格光谱',radar(scores)+order.map(i=>`<div class="row"><span>${types[i][0]}</span><div class="track"><div class="fill" style="width:${scores[i]/16*100}%"></div></div><span>${scores[i]}/16</span></div>`).join('')+'<p class="small">每种倾向出现 16 次，每选中一次计 1 分。总计 36 次选择；分数不代表人格占比，同分并列。</p>')+section(2,'三重底色',groups.map((s,k)=>`<div class="report-quote"><h4>${['主色','第二重','第三重'][k]} · ${order.filter(i=>scores[i]===s).map(i=>types[i][0]).join(' / ')}${order.filter(i=>scores[i]===s).length>1?'（并列）':''}</h4>${order.filter(i=>scores[i]===s).map(i=>`<p><b>${types[i][1]}</b>：${types[i][3]}</p>`).join('')}</div>`).join('')+'<p class="small">按不同得分层级展示前三组倾向，不表示隐藏人格或固定的心理层次。</p>')+`<div id="profile-selector" class="card"><label for="profile-choice">深入阅读一种倾向：</label><select id="profile-choice" onchange="showProfile(Number(this.value))">${order.map(i=>`<option value="${i}">${types[i][0]} · ${scores[i]}/16${ties.includes(i)?' · 并列最高'.replace('并列',ties.length>1?'并列':''):''}</option>`).join('')}</select><p class="small">默认展示得分最高的倾向；若同分，可逐一阅读，不指定唯一主型。也可查看其他倾向作对照。</p></div><div id="profile-detail">${detail(top)}</div><div class="nav"><button class="primary" onclick="window.print()">打印 / 保存为 PDF</button><button class="plain" onclick="download()">下载完整结果文本</button></div><div class="nav"><button class="plain" onclick="pos=35;render()">← 返回修改答案</button><button class="plain" onclick="reset()">重新测试</button></div>`;window.scrollTo(0,0)}
